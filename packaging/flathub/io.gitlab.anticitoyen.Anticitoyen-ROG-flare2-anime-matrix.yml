# Manifeste Flathub (construit sans réseau) ; python3-modules.json : généré par .gitlab-ci.yml (tâche flathub)
id: io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: animematrix
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio                 # visualiseurs audio (moniteur de la sortie son)
  - --share=network                     # bibliothèque d'animations, télécommande web (réseau local)
  - --device=all                        # accès HID/USB au clavier (règle udev installée sur l'hôte)
  - --filesystem=xdg-pictures           # galerie de GIF
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-download:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.*  # morceau en cours
modules:
  - python3-modules.json
  - name: animematrix
    buildsystem: simple
    build-commands:
      - packaging/install.sh / /app /usr/bin/python3
      - install -Dm644 packaging/flathub/io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix.metainfo.xml
        /app/share/metainfo/io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix.metainfo.xml
      - mv /app/share/applications/animematrix.desktop /app/share/applications/io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix.desktop
      - sed -i 's/^Icon=animematrix$/Icon=io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix/' /app/share/applications/io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix.desktop
      - mv /app/share/icons/hicolor/scalable/apps/animematrix.svg /app/share/icons/hicolor/scalable/apps/io.gitlab.anticitoyen.Anticitoyen-ROG-flare2-anime-matrix.svg
      - rm -rf /app/lib/systemd /app/lib/udev  # sans effet dans le bac à sable (règle udev : sur l'hôte)
    sources:
      - type: dir
        path: ../..
